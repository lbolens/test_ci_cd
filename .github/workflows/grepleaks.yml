name: Grepleaks Security Scan

  on:
    push:
      branches: [main, master, develop]

  jobs:
    security-scan:
      name: Security Scan
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Create code archive
          run: zip -r code.zip . -x ".git/*"

        - name: Run Grepleaks Scan
          run: |
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GREPLEAKS_API_KEY }}" \
              -F "file=@code.zip" \
              http://72.62.60.91/api/v1/scan)

            echo "Response: $RESPONSE"
