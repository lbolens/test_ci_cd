name: Grepleaks Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Grepleaks Scan
        uses: lbolens/grepleaks@v1
        id: scan
        with:
          api-key: ${{ secrets.GREPLEAKS_API_KEY }}

      - name: Display Results
        run: |
          echo "Security Score: ${{ steps.scan.outputs.security-score }}/100"
          echo "Grade: ${{ steps.scan.outputs.grade }}"
          echo "Total Findings: ${{ steps.scan.outputs.total-findings }}"
